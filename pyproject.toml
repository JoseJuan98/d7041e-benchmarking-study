[project]
name = "common"
version = "0.1.0"
description = "Common utilities"
authors = [
    {name = "Jose"}
]
license = {text = "LICENSE"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.0.0)",
    "scikit-learn (>=1.6.0)",
    "pandas[computation,parquet,performance,plot] (>=2.2.3)",
    "matplotlib (>=3.10.0)",
    "seaborn (>=0.13.2)",
    "ucimlrepo (>=0.0.7,<0.0.8)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = ">=24.3.0"
flake8 = ">=7.0.0"
isort = ">=5.9.3"
jupyter = "^1.1.1"
jupyterlab = "^4.3.4"

[tool.pytest]
addopts = "--vvv -s --color=yes"
testpaths = [
    "src/test"
]
filterwarnings = [
    "error",
    "ignore:The --rsyncdir command line argument and rsyncdirs config variable are deprecated.:DeprecationWarning"
]

[aliases]
test="pytest"

[tool.black]
line-length = 120
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
  | env
  | \.venv
  | \.env
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["common"]
src_paths = ["src"]